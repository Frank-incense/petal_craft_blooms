# Render Blueprint for the API server (https://render.com/docs/blueprint-spec).
# Secrets are `sync: false`: Render asks for them when the Blueprint is
# first applied, and they are never stored in this file.
services:
  - type: web
    name: petal-craft-api-staging
    runtime: node
    region: frankfurt        # closest Render region to Nairobi
    plan: starter            # free instances sleep; M-Pesa callbacks need it awake
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1          # must stay 1: the lock and sheet cache are per process
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_STORE
        value: sheets
      - key: SPREADSHEET_ID
        sync: false          # staging: the sheet COPY's ID
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false          # base64 of service-account.json
      - key: CORS_ORIGINS
        sync: false          # comma-separated site origins
      - key: ADMIN_TOKEN
        generateValue: true
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false          # leave empty in sandbox (defaults to 174379)
      - key: MPESA_CALLBACK_SECRET
        sync: false          # hex, 24+ chars (generateValue can contain "/")

  # The storefront: Vite build served as a static site.
  - type: web
    name: petal-craft-site-staging
    runtime: static
    buildCommand: npm ci && npm run build:css && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # staging: the API service's https://….onrender.com URL
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable   # hashed filenames
      - path: /src/views/*
        name: Cache-Control
        value: no-cache
